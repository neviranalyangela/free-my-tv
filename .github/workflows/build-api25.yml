name: Build API 25 launcher

on:
  push:
    branches: [api25]
  pull_request:
    branches: [api25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-api25:
    name: Launcher build (minSdk 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build generic APK
        run: ./build.sh --generic
      - name: Verify the APK really targets API 25
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging FreeMyTV.apk | grep -E "^package: |sdkVersion|targetSdkVersion"
          test "$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging FreeMyTV.apk | grep -o "sdkVersion:'25'")" = "sdkVersion:'25'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-API25-APK
          path: FreeMyTV.apk
          retention-days: 30
